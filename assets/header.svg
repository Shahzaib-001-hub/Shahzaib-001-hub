<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070e1e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Name Shimmer Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#60a5fa" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Code Block Background -->
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#030714" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Background Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
      }
      .cursor { animation: blink 1s infinite; }
      .pulse { animation: pulseDot 2s ease-in-out infinite; transform-origin: center; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container Frame & Background -->
  <rect width="960" height="380" rx="14" fill="url(#bgGrad)" />
  <rect width="960" height="380" rx="14" fill="url(#glowLeft)" />
  <rect width="960" height="380" rx="14" fill="url(#glowRight)" />
  <rect width="960" height="380" rx="14" fill="url(#grid)" />
  <rect width="958" height="378" x="1" y="1" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Top Title Bar -->
  <path d="M 1 14 Q 1 1 14 1 L 946 1 Q 959 1 959 14 L 959 38 L 1 38 Z" fill="#081024" />
  <line x1="1" y1="38" x2="959" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Window Dots -->
  <circle cx="24" cy="19" r="5.5" fill="#ef4444" />
  <circle cx="42" cy="19" r="5.5" fill="#f59e0b" />
  <circle cx="60" cy="19" r="5.5" fill="#10b981" />

  <!-- Center Title -->
  <text x="480" y="24" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" class="code-font">
    shahzaib@servyxo: ~ /portfolio (main*)
  </text>

  <!-- Top Right Available Badge -->
  <rect x="835" y="9" width="105" height="20" rx="10" fill="#0c1d42" stroke="#2563eb" stroke-width="1" />
  <circle cx="848" cy="19" r="3.5" fill="#10b981" class="pulse" />
  <text x="858" y="23" fill="#60a5fa" font-size="10.5" font-weight="700" class="code-font">AVAILABLE</text>

  <!-- ==================== LEFT COLUMN: BRANDING & BIO ==================== -->
  <g transform="translate(32, 58)">
    <!-- Developer Tag -->
    <rect x="0" y="0" width="140" height="22" rx="5" fill="#0c1e48" stroke="#38bdf8" stroke-width="0.9" />
    <text x="10" y="15" fill="#38bdf8" font-size="11.5" font-weight="700" class="code-font">&lt;DEVELOPER /&gt;</text>

    <!-- Main Name -->
    <text x="0" y="56" fill="url(#nameGrad)" font-size="34" font-weight="900" class="ui-font" letter-spacing="-0.5">
      Shahzaib Arbab
    </text>

    <!-- Roles & Subtitle -->
    <text x="0" y="86" fill="#38bdf8" font-size="14.5" font-weight="700" class="code-font">
      Full Stack Developer <tspan fill="#64748b">•</tspan> Co-Founder @ Servyxo
    </text>

    <!-- Mission Statement -->
    <text x="0" y="112" fill="#94a3b8" font-size="12.5" font-weight="400" class="ui-font">
      Engineering scalable web apps, robust APIs &amp; modern SaaS.
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 134)">
      <!-- Next.js -->
      <rect x="0" y="0" width="68" height="24" rx="5" fill="#111c36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="34" y="16" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Next.js</text>

      <!-- React -->
      <rect x="74" y="0" width="60" height="24" rx="5" fill="#111c36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="104" y="16" fill="#61dafb" font-size="11" font-weight="600" text-anchor="middle" class="code-font">React</text>

      <!-- Node.js -->
      <rect x="140" y="0" width="68" height="24" rx="5" fill="#111c36" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="174" y="16" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Node.js</text>

      <!-- MongoDB -->
      <rect x="214" y="0" width="76" height="24" rx="5" fill="#111c36" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="252" y="16" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle" class="code-font">MongoDB</text>

      <!-- Tailwind -->
      <rect x="296" y="0" width="74" height="24" rx="5" fill="#111c36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="333" y="16" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Tailwind</text>
    </g>

    <!-- Key Platform Badges -->
    <g transform="translate(0, 172)">
      <!-- Servyxo Card -->
      <rect x="0" y="0" width="185" height="38" rx="7" fill="#081430" stroke="#1d4ed8" stroke-width="1" />
      <circle cx="16" cy="19" r="4.5" fill="#38bdf8" />
      <text x="28" y="16" fill="#94a3b8" font-size="9.5" font-weight="700" class="ui-font">COMPANY / AGENCY</text>
      <text x="28" y="29" fill="#ffffff" font-size="11.5" font-weight="700" class="code-font">servyxo.com</text>

      <!-- EveryBeat Blog Card -->
      <rect x="195" y="0" width="185" height="38" rx="7" fill="#081430" stroke="#1d4ed8" stroke-width="1" />
      <circle cx="211" cy="19" r="4.5" fill="#0284c7" />
      <text x="223" y="16" fill="#94a3b8" font-size="9.5" font-weight="700" class="ui-font">BLOG PLATFORM</text>
      <text x="223" y="29" fill="#ffffff" font-size="11.5" font-weight="700" class="code-font">everybeat.blog</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 224)">
      <rect x="0" y="0" width="380" height="28" rx="6" fill="#060e22" stroke="#1e3a8a" stroke-width="0.8" />
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
      <text x="26" y="18" fill="#cbd5e1" font-size="11" font-weight="600" class="code-font">Stack: MERN &amp; Next.js Architecture</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: IDE CODE WINDOW ==================== -->
  <g transform="translate(445, 52)">
    <!-- Editor Frame -->
    <rect width="485" height="305" rx="10" fill="url(#codeBg)" />
    <rect width="485" height="305" rx="10" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.85" />

    <!-- Editor Top Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 475 0 Q 485 0 485 10 L 485 28 L 0 28 Z" fill="#060b18" />
    <line x1="0" y1="28" x2="485" y2="28" stroke="#1e293b" stroke-width="0.8" />

    <!-- File Tab -->
    <rect x="12" y="5" width="130" height="19" rx="4" fill="#0d1f44" stroke="#2563eb" stroke-width="0.8" />
    <circle cx="22" cy="14.5" r="3" fill="#38bdf8" />
    <text x="32" y="18.5" fill="#e2e8f0" font-size="10.5" font-weight="600" class="code-font">developer.ts</text>
    <text x="472" y="18.5" fill="#64748b" font-size="9.5" font-weight="500" text-anchor="end" class="code-font">TypeScript</text>

    <!-- Editor Code Lines -->
    <g transform="translate(14, 48)" class="code-font" font-size="11.5" font-weight="500">
      <!-- Line 1 -->
      <text x="0" y="0">
        <tspan fill="#64748b">1</tspan>
        <tspan dx="14" fill="#f43f5e">const</tspan>
        <tspan dx="8" fill="#38bdf8">engineer</tspan>
        <tspan fill="#cbd5e1">: Developer = {</tspan>
      </text>

      <!-- Line 2 -->
      <text x="0" y="21">
        <tspan fill="#64748b">2</tspan>
        <tspan dx="14" fill="#94a3b8">  name:</tspan>
        <tspan dx="8" fill="#a7f3d0">"Shahzaib Arbab"</tspan>
        <tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="42">
        <tspan fill="#64748b">3</tspan>
        <tspan dx="14" fill="#94a3b8">  role:</tspan>
        <tspan dx="8" fill="#a7f3d0">"Full Stack Developer"</tspan>
        <tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="0" y="63">
        <tspan fill="#64748b">4</tspan>
        <tspan dx="14" fill="#94a3b8">  company:</tspan>
        <tspan dx="8" fill="#38bdf8">"Co-Founder @ Servyxo"</tspan>
        <tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 5 -->
      <text x="0" y="84">
        <tspan fill="#64748b">5</tspan>
        <tspan dx="14" fill="#94a3b8">  blogPlatform:</tspan>
        <tspan dx="8" fill="#38bdf8">"EveryBeat.blog"</tspan>
        <tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 6 -->
      <text x="0" y="105">
        <tspan fill="#64748b">6</tspan>
        <tspan dx="14" fill="#94a3b8">  stack:</tspan>
        <tspan dx="8" fill="#cbd5e1">[</tspan>
        <tspan fill="#fde047">"Next.js"</tspan>
        <tspan fill="#cbd5e1">, </tspan>
        <tspan fill="#fde047">"React"</tspan>
        <tspan fill="#cbd5e1">, </tspan>
        <tspan fill="#fde047">"Node"</tspan>
        <tspan fill="#cbd5e1">, </tspan>
        <tspan fill="#fde047">"MongoDB"</tspan>
        <tspan fill="#cbd5e1">],</tspan>
      </text>

      <!-- Line 7 -->
      <text x="0" y="126">
        <tspan fill="#64748b">7</tspan>
        <tspan dx="14" fill="#94a3b8">  focus:</tspan>
        <tspan dx="8" fill="#a7f3d0">"SaaS &amp; Scalable Web Apps"</tspan>
        <tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 8 -->
      <text x="0" y="147">
        <tspan fill="#64748b">8</tspan>
        <tspan dx="14" fill="#94a3b8">  status:</tspan>
        <tspan dx="8" fill="#38bdf8">"Open For Collaboration"</tspan>
      </text>

      <!-- Line 9 -->
      <text x="0" y="168">
        <tspan fill="#64748b">9</tspan>
        <tspan dx="14" fill="#cbd5e1">};</tspan>
      </text>

      <!-- Line 10: Terminal CLI Command -->
      <text x="0" y="196">
        <tspan fill="#64748b">10</tspan>
        <tspan dx="14" fill="#4ade80">&gt;</tspan>
        <tspan dx="6" fill="#38bdf8">npm run build</tspan>
        <tspan dx="6" fill="#94a3b8">--production</tspan>
      </text>

      <!-- Line 11: Output -->
      <text x="0" y="217">
        <tspan fill="#64748b">11</tspan>
        <tspan dx="14" fill="#22c55e">✓ Ready on https://servyxo.com</tspan>
        <tspan dx="4" fill="#38bdf8" class="cursor">█</tspan>
      </text>
    </g>
  </g>
</svg>
