<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070e1e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Code Block Background -->
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091024" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .cursor { animation: blink 1s infinite; }
      .pulse { animation: pulseDot 2s ease-in-out infinite; transform-origin: center; }
      .floating { animation: float 4s ease-in-out infinite; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Main Container Background -->
  <rect width="960" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="420" rx="16" fill="url(#glow)" />
  <rect width="960" height="420" rx="16" fill="url(#cyanGlow)" />
  <rect width="960" height="420" rx="16" fill="url(#grid)" />
  <rect width="958" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.85" />

  <!-- Terminal Top Header Bar -->
  <path d="M 1 16 Q 1 1 16 1 L 944 1 Q 959 1 959 16 L 959 44 L 1 44 Z" fill="#091226" />
  <line x1="1" y1="44" x2="959" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="48" cy="22" r="6" fill="#f59e0b" />
  <circle cx="68" cy="22" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="480" y="27" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" class="code-font">
    shahzaib@servyxo: ~ /portfolio (main*)
  </text>

  <!-- Status Indicator Badge (Top Right) -->
  <rect x="830" y="12" width="105" height="22" rx="11" fill="#0f2756" stroke="#2563eb" stroke-width="1" />
  <circle cx="844" cy="23" r="4" fill="#10b981" class="pulse" />
  <text x="856" y="27" fill="#60a5fa" font-size="11" font-weight="700" class="code-font">AVAILABLE</text>

  <!-- ==================== LEFT HERO COLUMN ==================== -->
  <g transform="translate(42, 75)">
    <!-- Developer Tag -->
    <rect x="0" y="0" width="152" height="24" rx="6" fill="#0f2756" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="12" y="16" fill="#38bdf8" font-size="12" font-weight="700" class="code-font">&lt;DEVELOPER /&gt;</text>

    <!-- Main Name -->
    <text x="0" y="70" fill="url(#nameGrad)" font-size="38" font-weight="900" class="ui-font" letter-spacing="-0.5">
      Shahzaib Arbab
    </text>

    <!-- Roles & Subtitle -->
    <text x="0" y="105" fill="#38bdf8" font-size="16" font-weight="700" class="code-font">
      Full Stack Developer <tspan fill="#64748b">•</tspan> Founder @ Servyxo
    </text>

    <!-- One-line value statement -->
    <text x="0" y="132" fill="#94a3b8" font-size="13" font-weight="400" class="ui-font">
      Architecting high-performance web applications, scalable APIs &amp; modern SaaS.
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Next.js -->
      <rect x="0" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="38" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Next.js</text>

      <!-- Pill 2: React -->
      <rect x="84" y="0" width="68" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="118" y="17" fill="#61dafb" font-size="11" font-weight="600" text-anchor="middle" class="code-font">React</text>

      <!-- Pill 3: Node.js -->
      <rect x="160" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
      <text x="198" y="17" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Node.js</text>

      <!-- Pill 4: MongoDB -->
      <rect x="244" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
      <text x="287" y="17" fill="#86efac" font-size="11" font-weight="600" text-anchor="middle" class="code-font">MongoDB</text>

      <!-- Pill 5: Tailwind -->
      <rect x="338" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="380" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="code-font">Tailwind</text>
    </g>

    <!-- Key Metric Badges (Row 2) -->
    <g transform="translate(0, 202)">
      <!-- Metric 1: Servyxo -->
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#0b1736" stroke="#2563eb" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="16" fill="#94a3b8" font-size="10" font-weight="600" class="ui-font">COMPANY</text>
      <text x="32" y="27" fill="#ffffff" font-size="11" font-weight="700" class="code-font">servyxo.com</text>

      <!-- Metric 2: EveryBeat -->
      <rect x="178" y="0" width="168" height="34" rx="8" fill="#0b1736" stroke="#2563eb" stroke-width="1.2" />
      <circle cx="196" cy="17" r="5" fill="#a855f7" />
      <text x="210" y="16" fill="#94a3b8" font-size="10" font-weight="600" class="ui-font">FLAGSHIP BLOG</text>
      <text x="210" y="27" fill="#ffffff" font-size="11" font-weight="700" class="code-font">everybeat.blog</text>

      <!-- Metric 3: Focus -->
      <rect x="356" y="0" width="105" height="34" rx="8" fill="#0b1736" stroke="#2563eb" stroke-width="1.2" />
      <text x="408" y="16" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="ui-font">STACK</text>
      <text x="408" y="27" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="code-font">MERN / Next</text>
    </g>
  </g>

  <!-- ==================== RIGHT CODE EDITOR WINDOW ==================== -->
  <g transform="translate(525, 75)" class="floating">
    <!-- Editor Frame -->
    <rect width="395" height="295" rx="12" fill="url(#codeBg)" />
    <rect width="395" height="295" rx="12" fill="none" stroke="#1e3a8a" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Editor Header Tab -->
    <path d="M 0 12 Q 0 0 12 0 L 383 0 Q 395 0 395 12 L 395 30 L 0 30 Z" fill="#070c1a" />
    <line x1="0" y1="30" x2="395" y2="30" stroke="#1e293b" stroke-width="1" />

    <!-- Tab Pill -->
    <rect x="14" y="6" width="135" height="20" rx="4" fill="#0e1f46" stroke="#2563eb" stroke-width="0.8" />
    <circle cx="26" cy="16" r="3.5" fill="#38bdf8" />
    <text x="36" y="20" fill="#cbd5e1" font-size="11" font-weight="600" class="code-font">developer.ts</text>

    <!-- Breadcrumb -->
    <text x="380" y="20" fill="#64748b" font-size="10" font-weight="500" text-anchor="end" class="code-font">UTF-8</text>

    <!-- Code Content -->
    <g transform="translate(18, 54)" class="code-font" font-size="12" font-weight="500">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#64748b">1</text>
      <text x="24" y="0" fill="#f43f5e">const</text>
      <text x="66" y="0" fill="#38bdf8">developer</text>
      <text x="140" y="0" fill="#94a3b8">=</text>
      <text x="156" y="0" fill="#f8fafc">{</text>

      <!-- Line 2 -->
      <text x="0" y="22" fill="#64748b">2</text>
      <text x="24" y="22" fill="#e2e8f0">&nbsp;&nbsp;name:</text>
      <text x="96" y="22" fill="#a7f3d0">"Shahzaib Arbab"</text>
      <text x="238" y="22" fill="#94a3b8">,</text>

      <!-- Line 3 -->
      <text x="0" y="44" fill="#64748b">3</text>
      <text x="24" y="44" fill="#e2e8f0">&nbsp;&nbsp;role:</text>
      <text x="96" y="44" fill="#a7f3d0">"Full Stack Developer"</text>
      <text x="286" y="44" fill="#94a3b8">,</text>

      <!-- Line 4 -->
      <text x="0" y="66" fill="#64748b">4</text>
      <text x="24" y="66" fill="#e2e8f0">&nbsp;&nbsp;founder:</text>
      <text x="118" y="66" fill="#38bdf8">"Servyxo"</text>
      <text x="194" y="66" fill="#94a3b8">,</text>

      <!-- Line 5 -->
      <text x="0" y="88" fill="#64748b">5</text>
      <text x="24" y="88" fill="#e2e8f0">&nbsp;&nbsp;platform:</text>
      <text x="126" y="88" fill="#38bdf8">"EveryBeat.blog"</text>
      <text x="254" y="88" fill="#94a3b8">,</text>

      <!-- Line 6 -->
      <text x="0" y="110" fill="#64748b">6</text>
      <text x="24" y="110" fill="#e2e8f0">&nbsp;&nbsp;stack:</text>
      <text x="96" y="110" fill="#f8fafc">[</text>
      <text x="108" y="110" fill="#fde047">"Next.js"</text>
      <text x="178" y="110" fill="#94a3b8">,&nbsp;</text>
      <text x="192" y="110" fill="#fde047">"React"</text>
      <text x="250" y="110" fill="#94a3b8">,&nbsp;</text>
      <text x="264" y="110" fill="#fde047">"Node"</text>
      <text x="314" y="110" fill="#f8fafc">]</text>
      <text x="322" y="110" fill="#94a3b8">,</text>

      <!-- Line 7 -->
      <text x="0" y="132" fill="#64748b">7</text>
      <text x="24" y="132" fill="#e2e8f0">&nbsp;&nbsp;database:</text>
      <text x="134" y="132" fill="#a7f3d0">"MongoDB / Mongoose"</text>
      <text x="298" y="132" fill="#94a3b8">,</text>

      <!-- Line 8 -->
      <text x="0" y="154" fill="#64748b">8</text>
      <text x="24" y="154" fill="#e2e8f0">&nbsp;&nbsp;openForWork:</text>
      <text x="156" y="154" fill="#38bdf8">true</text>
      <text x="192" y="154" fill="#94a3b8">,</text>

      <!-- Line 9 -->
      <text x="0" y="176" fill="#64748b">9</text>
      <text x="24" y="176" fill="#f8fafc">};</text>

      <!-- Line 10 (Interactive Execution) -->
      <text x="0" y="202" fill="#64748b">10</text>
      <text x="24" y="202" fill="#4ade80">&gt;</text>
      <text x="40" y="202" fill="#38bdf8">Ready to collaborate</text>
      <rect x="206" y="190" width="7" height="15" fill="#38bdf8" class="cursor" />
    </g>
  </g>
</svg>
