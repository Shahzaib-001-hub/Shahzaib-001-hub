name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shahzaib-001-hub
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0f172a,#1e3a8a,#2563eb,#60a5fa,#93c5fd
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#2563eb&color_dots=#f1f5f9,#dbeafe,#93c5fd,#3b82f6,#1d4ed8

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
